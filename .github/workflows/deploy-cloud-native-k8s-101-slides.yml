name: Deploy Cloud Native K8s 101 slides

on:
  push:
    branches: [main]
    paths:
      - 'slides/cloud-native-k8s-101/**'
      - '.github/workflows/deploy-cloud-native-k8s-101-slides.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-cloud-native-k8s-101
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slides/cloud-native-k8s-101
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: slides/cloud-native-k8s-101/package-lock.json
      - run: npm ci
      - name: Build Slidev site
        run: npx slidev build --base /talks/cloud-native-k8s-101/
      - name: Stage under site subdirectory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_site/cloud-native-k8s-101"
          cp -a dist/. "$GITHUB_WORKSPACE/_site/cloud-native-k8s-101/"
          cp dist/404.html "$GITHUB_WORKSPACE/_site/404.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
