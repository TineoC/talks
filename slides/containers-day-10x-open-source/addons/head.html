<!-- Injected into this deck's <head> at stage time by scripts/inject-deck-addons.mjs.
     Keeps the exported bundle byte-identical to what Claude Design produced. -->
<script src="addons/theme-toggle.js"></script>
<style>
  /* The deck's own light tokens cover every semantic color, but a handful of
     inline styles hardcode a dark-theme drop shadow (rgba(0,0,0,.5) and
     friends) that reads as a smudge on a light page. Inline styles outrank a
     stylesheet, so these need !important. */
  [data-theme='light'] [style*='box-shadow'] {
    box-shadow: 0 18px 45px rgba(21, 27, 40, 0.14) !important;
  }

  /* Cards tagged by theme-toggle.js: an inline white-on-white glass fill that
     disappears against a light page (the career.log terminal, stat cards). */
  [data-theme='light'] [data-glass-surface] {
    background: rgba(21, 27, 40, 0.04) !important;
  }

  /* The unpack screen is painted by the bundler shell, before the deck's own
     stylesheet exists — match the theme so there's no dark flash on a
     light-mode load. */
  [data-theme='light'] body {
    background: #f7f9fc;
  }
</style>
